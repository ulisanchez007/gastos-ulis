<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mis Gastos</title><style>*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#0f1115;color:#fff;padding:14px}h1{font-size:21px}small{color:#aaa}.card{background:#1c1f27;border-radius:16px;padding:14px;margin:10px 0}.btn{width:100%;padding:13px;border:0;border-radius:12px;font-size:15px;font-weight:700;margin:5px 0;cursor:pointer}.p{background:#ffcc00}.n{background:#00c853;color:#fff}.pr{background:#ff3d00;color:#fff}.g{background:#333;color:#fff}.blue{background:#2979ff;color:#fff}.red{background:#d32f2f;color:#fff}input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid #333;background:#111;color:#fff;margin:5px 0}.row{display:flex;gap:8px}.row>*{flex:1}.item{background:#111;padding:10px;border-radius:12px;margin:8px 0}.flex{display:flex;justify-content:space-between;gap:8px}.badge{font-size:12px;background:#333;padding:4px 8px;border-radius:20px}.neg{color:#ff5252}.pos{color:#69f0ae}.hidden{display:none}.sug{background:#2a2e3a;padding:7px 9px;border-radius:20px;margin:3px;display:inline-block;font-size:13px}.t{color:#ffcc00;font-size:13px;margin:12px 0 4px;text-transform:uppercase}.sb{padding:7px 9px;border-radius:9px;border:0;background:#333;color:#fff}.sync{font-size:13px;padding:8px;border-radius:10px;text-align:center;margin:6px 0}.ok{background:#1b5e20}.pend{background:#7a5200}</style></head><body>
<h1>💰 Mis Gastos</h1><small>Solo tú • Cel + nube</small>
<div id="syncStatus" class="sync pend">⏳ Pendiente de subir</div>
<button class="btn g" onclick="sincronizar()">🔄 Sincronizar ahora</button>
<div class="card"><b>Mi dinero</b><div class="flex"><span>💵 Efectivo</span><b id="bE">$0</b></div><div class="flex"><span>💳 Tarjetas crédito</span><b id="bT">$0</b></div><div class="flex"><span>🏦 Cuentas débito</span><b id="bD">$0</b></div><div class="flex"><span>Total disponible</span><b id="bTot">$0</b></div><div class="row"><button class="btn g" onclick="show('cartera')">⚙️ Editar dinero</button><button class="btn g" onclick="backup()">💾 Respaldar</button></div><button class="btn g" onclick="inst()">📲 Instalar en pantalla principal</button><label><small>Restaurar respaldo .json</small></label><input type="file" accept=".json" onchange="restore(event)"></div>
<div id="home"><button class="btn blue" onclick="show('nuevo')">➕ Registrar gasto</button><button class="btn g" onclick="show('buscar')">🔍 Buscar</button><button class="btn g" onclick="show('reporte')">📊 Reportes</button><div id="lista"></div></div>
<div id="cartera" class="hidden card"><h3>Mi dinero</h3><label>Efectivo</label><input id="inE" type="number" placeholder="5000"><button class="btn blue" onclick="saveE()">Guardar efectivo</button><div class="t">💳 Tarjetas de crédito</div><div id="lT"></div><input id="nT" placeholder="Nombre tarjeta Ej. Nu"><input id="mT" type="number" placeholder="Saldo, puede ser -2000"><button class="btn pr" onclick="addT()">+ Agregar tarjeta de crédito</button><div class="t">🏦 Cuentas de débito</div><div id="lD"></div><input id="nD" placeholder="Nombre débito Ej. BBVA Débito"><input id="mD" type="number" placeholder="Saldo Ej. 10000"><button class="btn n" onclick="addD()">+ Agregar cuenta débito</button><button class="btn g" onclick="show('home')">Volver</button></div>
<div id="nuevo" class="hidden card"><h3 id="pt">1. ¿Qué tipo?</h3><div id="p1"><button class="btn p" onclick="setT('Personal')">PERSONAL</button><button class="btn n" onclick="setT('Negocio')">NEGOCIO</button><button class="btn pr" onclick="setT('Préstamo')">PRÉSTAMO</button></div><div id="p2" class="hidden"><input id="monto" type="number" placeholder="Monto $"><label id="lp" class="hidden">¿A quién le prestaste?</label><input id="qp" class="hidden" placeholder="Nombre"><div class="row"><button class="btn p" onclick="tmp.sub='Personal'">Personal</button><button class="btn n" onclick="tmp.sub='Negocio'">Negocio</button></div><button class="btn blue" onclick="go3()">Siguiente →</button></div><div id="p3" class="hidden"><button class="btn g" onclick="setP('Efectivo')">💵 EFECTIVO</button><button class="btn g" onclick="setP('Transferencia')">🏦 TRANSFERENCIA - débito</button><button class="btn g" onclick="setP('Tarjeta')">💳 TARJETA - crédito</button><div id="bb" class="hidden"><label id="bl">Elige cuenta</label><select id="banco"></select></div><button class="btn blue" onclick="go4()">Siguiente →</button></div><div id="p4" class="hidden"><input id="desc" placeholder="Descripción Ej. gasolina" oninput="sug()"><div id="sgs"></div><textarea id="desc2" placeholder="Detalle opcional"></textarea><button class="btn blue" onclick="saveG()">✅ Guardar gasto</button></div><button class="btn g" onclick="show('home')">Cancelar</button></div>
<div id="buscar" class="hidden card"><h3>🔍 Buscar</h3><div class="row"><input id="fD" type="date"><input id="fH" type="date"></div><div class="row"><select id="fT"><option value="">Todos tipos</option><option>Personal</option><option>Negocio</option><option>Préstamo</option></select><select id="fP"><option value="">Todos pagos</option><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option></select></div><input id="fX" placeholder="Buscar descripción"><button class="btn blue" onclick="doBuscar()">Buscar</button><div id="rB"></div><button class="btn g" onclick="show('home')">Volver</button></div>
<div id="reporte" class="hidden card"><h3>📊 Reporte</h3><select id="rT"><option value="todo">Total general</option><option value="tipo">Por Personal/Negocio/Préstamo</option><option value="pago">Por Efectivo/Transferencia/Tarjeta</option><option value="ambos">Por tipo Y por pago</option></select><div class="row"><input id="rD" type="date"><input id="rH" type="date"></div><div class="row"><input id="rM" type="month"><select id="rA"><option value="">Año</option><option>2025</option><option selected>2026</option><option>2027</option></select></div><button class="btn blue" onclick="doRep()">Generar</button><div id="rR"></div><button class="btn g" onclick="show('home')">Volver</button></div>
<script>
// ===== CONFIG PARA LU =====
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzkSUhkWSTOjbv3q1dOn3G64SzADbabuY2OakECoOGz82wcGMkNwnT4guglkm7X6AwH/exec";
const CLAVE = "553bbc8e9c3cf58cba2013a79e4f10ad";
// ============================
let gastos=JSON.parse(localStorage.getItem('gastos')||'[]');let cr=JSON.parse(localStorage.getItem('cartera')||'{}');let cartera={efectivo:Number(cr.efectivo||0),tarjetas:cr.tarjetas||[],debitos:cr.debitos||[],actualizado:cr.actualizado||0};
if(cr.cuentas&&cr.cuentas.length){cr.cuentas.forEach(c=>{let n=(c.nombre||'').toLowerCase();let es=n.includes('tarjeta')||n.includes('credito')||n.includes('crédito')||n.includes('nu');(es?cartera.tarjetas:cartera.debitos).push({nombre:c.nombre,monto:Number(c.monto||0)})})}
let tmp={},dp=null,pendiente=localStorage.getItem('pendiente')=='1',delArmado=null,delCArmado=null,sugList=[];
let borrados=JSON.parse(localStorage.getItem('borrados')||'[]');
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e});addEventListener('online',()=>sincronizar());
function fechaLocal(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function inst(){if(dp)dp.prompt();else alert('En tu cel: menú ⋮ o Compartir > Agregar a pantalla principal')}
function fmt(n){return '$'+Number(n||0).toLocaleString('es-MX')}
function setSync(ok){let el=document.getElementById('syncStatus');el.textContent=ok?'✅ Sincronizado con Lu':'⏳ Pendiente de subir';el.className='sync '+(ok?'ok':'pend');pendiente=!ok;localStorage.setItem('pendiente',pendiente?'1':'0')}
function save(){localStorage.setItem('gastos',JSON.stringify(gastos));localStorage.setItem('cartera',JSON.stringify(cartera));render();subir()}
async function subir(){if(!SCRIPT_URL||SCRIPT_URL.includes('PEGA_AQUI')){setSync(false);return}try{let r=await fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({clave:CLAVE,accion:'subir',gastos,cartera,borrados})});let j=await r.json();if(j.ok){borrados=[];localStorage.setItem('borrados','[]')}setSync(!!j.ok)}catch(e){setSync(false)}}
async function bajar(){if(!SCRIPT_URL||SCRIPT_URL.includes('PEGA_AQUI'))return;try{let r=await fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({clave:CLAVE,accion:'bajar'})});let j=await r.json();if(!j.ok)return;let map={};gastos.forEach(g=>map[g.id]=g);(j.gastos||[]).forEach(g=>{let o=map[g.id];if(!o||(g.actualizado||0)>=(o.actualizado||0))map[g.id]=g});gastos=Object.values(map).sort((a,b)=>(a.id||0)-(b.id||0));if(j.cartera&&j.cartera.actualizado>(cartera.actualizado||0))cartera=j.cartera;localStorage.setItem('gastos',JSON.stringify(gastos));localStorage.setItem('cartera',JSON.stringify(cartera));render()}catch(e){}}
async function sincronizar(){await bajar();await subir();render()}
function show(id){['home','cartera','nuevo','buscar','reporte'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(id).classList.remove('hidden');render()}
function render(){let tT=cartera.tarjetas.reduce((a,c)=>a+ +c.monto,0),tD=cartera.debitos.reduce((a,c)=>a+ +c.monto,0);document.getElementById('bE').textContent=fmt(cartera.efectivo);document.getElementById('bT').textContent=fmt(tT);document.getElementById('bD').textContent=fmt(tD);document.getElementById('bTot').textContent=fmt(cartera.efectivo+tT+tD);document.getElementById('inE').value=cartera.efectivo;
document.getElementById('lT').innerHTML=cartera.tarjetas.map((c,i)=>{let arm=delCArmado==='tarjetas:'+i;return `<div class="item flex"><span>${c.nombre}</span><span><b class="${c.monto<0?'neg':'pos'}">${fmt(c.monto)}</b> <button class="${arm?'red':'sb'}" onclick="delC('tarjetas',${i})">${arm?'¿Seguro?':'✕'}</button></span></div>`}).join('')||'<small>Sin tarjetas</small>';
document.getElementById('lD').innerHTML=cartera.debitos.map((c,i)=>{let arm=delCArmado==='debitos:'+i;return `<div class="item flex"><span>${c.nombre}</span><span><b class="${c.monto<0?'neg':'pos'}">${fmt(c.monto)}</b> <button class="${arm?'red':'sb'}" onclick="delC('debitos',${i})">${arm?'¿Seguro?':'✕'}</button></span></div>`}).join('')||'<small>Sin débito</small>';
document.getElementById('lista').innerHTML=gastos.slice().reverse().slice(0,30).map((g,i)=>{let idx=gastos.length-1-i;let arm=delArmado===idx;return `<div class="item"><div class="flex"><b>${g.tipo} • ${fmt(g.monto)}</b><span class="badge">${g.pago}</span></div><div>${g.desc||''} ${g.quien?('• Préstamo a: '+g.quien):''}</div><small>${g.fecha||''} • ${g.sub||''} ${g.banco?('• '+g.banco):''}</small><div class="row"><button class="btn g" onclick="edit(${idx})">Editar</button><button class="btn ${arm?'red':'g'}" onclick="del(${idx},this)">${arm?'¿Seguro? Toca otra vez para borrar':'Borrar'}</button></div></div>`}).join('')||'<p>No hay gastos</p>'}
function delC(t,i){let key=t+':'+i;if(delCArmado!==key){delCArmado=key;render();setTimeout(()=>{if(delCArmado===key){delCArmado=null;render()}},3000);return}cartera[t].splice(i,1);cartera.actualizado=Date.now();delCArmado=null;save()}
function saveE(){let v=document.getElementById('inE').value;if(v!=='')cartera.efectivo=Number(v);cartera.actualizado=Date.now();save();alert('Efectivo guardado')}
function addT(){let n=document.getElementById('nT').value.trim(),m=document.getElementById('mT').value;if(!n)return alert('Pon nombre tarjeta');cartera.tarjetas.push({nombre:n,monto:Number(m||0)});cartera.actualizado=Date.now();document.getElementById('nT').value='';document.getElementById('mT').value='';save()}
function addD(){let n=document.getElementById('nD').value.trim(),m=document.getElementById('mD').value;if(!n)return alert('Pon nombre cuenta');cartera.debitos.push({nombre:n,monto:Number(m||0)});cartera.actualizado=Date.now();document.getElementById('nD').value='';document.getElementById('mD').value='';save()}
function apply(g,s){if(g.pago=='Efectivo')cartera.efectivo+=s*+g.monto;if(g.pago=='Tarjeta'){let c=cartera.tarjetas.find(x=>x.nombre==g.banco);if(c)c.monto+=s*+g.monto}if(g.pago=='Transferencia'){let c=cartera.debitos.find(x=>x.nombre==g.banco);if(c)c.monto+=s*+g.monto}}
function setT(t){tmp={tipo:t,sub:t};document.getElementById('p1').classList.add('hidden');document.getElementById('p2').classList.remove('hidden');document.getElementById('pt').textContent='2. Monto';let sh=t=='Préstamo';document.getElementById('lp').classList.toggle('hidden',!sh);document.getElementById('qp').classList.toggle('hidden',!sh)}
function go3(){tmp.monto=Number(document.getElementById('monto').value);tmp.quien=document.getElementById('qp').value;if(!tmp.monto)return alert('Pon monto');if(!tmp.sub)return alert('Elige Personal o Negocio');document.getElementById('p2').classList.add('hidden');document.getElementById('p3').classList.remove('hidden');document.getElementById('pt').textContent='3. ¿Cómo pagaste?'}
function setP(p){tmp.pago=p;let b=document.getElementById('bb'),s=document.getElementById('banco');if(p=='Efectivo')b.classList.add('hidden');else if(p=='Tarjeta'){b.classList.remove('hidden');document.getElementById('bl').textContent='¿De qué tarjeta de crédito?';s.innerHTML=cartera.tarjetas.map(c=>`<option value="${c.nombre}">${c.nombre} (${fmt(c.monto)})</option>`).join('')||'<option value="">No hay tarjetas</option>'}else{b.classList.remove('hidden');document.getElementById('bl').textContent='¿De qué cuenta débito?';s.innerHTML=cartera.debitos.map(c=>`<option value="${c.nombre}">${c.nombre} (${fmt(c.monto)})</option>`).join('')||'<option value="">No hay débito</option>'}}
function go4(){if(!tmp.pago)return alert('Elige pago');if(tmp.pago!='Efectivo'){tmp.banco=document.getElementById('banco').value;if(!tmp.banco)return alert('Elige cuenta')}else tmp.banco='Efectivo';document.getElementById('p3').classList.add('hidden');document.getElementById('p4').classList.remove('hidden');document.getElementById('pt').textContent='4. Descripción';sug()}
function sug(){let v=[...new Set(gastos.map(g=>g.desc))].filter(Boolean);let q=document.getElementById('desc').value.toLowerCase();sugList=v.filter(x=>x.toLowerCase().includes(q));document.getElementById('sgs').innerHTML=sugList.map((x,i)=>`<span class="sug" onclick="ponSug(${i})">${x}</span>`).join('')}
function ponSug(i){document.getElementById('desc').value=sugList[i]||'';document.getElementById('sgs').innerHTML=''}
function saveG(){tmp.desc=document.getElementById('desc').value||'Sin descripción';tmp.desc2=document.getElementById('desc2').value;tmp.fecha=fechaLocal();tmp.id=Date.now();tmp.actualizado=Date.now();gastos.push(tmp);apply(tmp,-1);cartera.actualizado=Date.now();save();alert('Guardado');document.getElementById('p4').classList.add('hidden');document.getElementById('p1').classList.remove('hidden');document.getElementById('pt').textContent='1. ¿Qué tipo?';['monto','desc','desc2','qp'].forEach(id=>document.getElementById(id).value='');show('home')}
function doBuscar(){let d=document.getElementById('fD').value,h=document.getElementById('fH').value,t=document.getElementById('fT').value,p=document.getElementById('fP').value,x=document.getElementById('fX').value.toLowerCase();let r=gastos.filter(g=>(!d||g.fecha>=d)&&(!h||g.fecha<=h)&&(!t||g.tipo==t)&&(!p||g.pago==p)&&(!x||(g.desc||'').toLowerCase().includes(x)));document.getElementById('rB').innerHTML=r.map(g=>`<div class="item"><b>${g.tipo} • ${fmt(g.monto)}</b><div>${g.desc} • ${g.fecha} • ${g.pago} ${g.banco?('• '+g.banco):''}</div></div>`).join('')||'Sin resultados'}
function doRep(){let d=document.getElementById('rD').value,h=document.getElementById('rH').value,m=document.getElementById('rM').value,a=document.getElementById('rA').value;let r=gastos.filter(g=>{if(d&&h)return g.fecha>=d&&g.fecha<=h;if(m)return (g.fecha||'').startsWith(m);if(a)return (g.fecha||'').startsWith(a);return true});let tot=r.reduce((x,g)=>x+ +g.monto,0),ty=document.getElementById('rT').value,html=`<h3>Total: ${fmt(tot)} • ${r.length} gastos</h3>`;if(ty=='tipo'||ty=='ambos')['Personal','Negocio','Préstamo'].forEach(t=>{html+=`<div class="flex"><span>${t}</span><b>${fmt(r.filter(g=>g.tipo==t).reduce((x,g)=>x+ +g.monto,0))}</b></div>`});if(ty=='pago'||ty=='ambos')['Efectivo','Transferencia','Tarjeta'].forEach(t=>{html+=`<div class="flex"><span>${t}</span><b>${fmt(r.filter(g=>g.pago==t).reduce((x,g)=>x+ +g.monto,0))}</b></div>`});html+=r.map(g=>`<div class="item">${g.fecha} • ${g.tipo} • ${fmt(g.monto)} • ${g.desc} • ${g.pago} ${g.banco?('• '+g.banco):''}</div>`).join('');document.getElementById('rR').innerHTML=html}
function del(i,btn){if(delArmado!==i){delArmado=i;render();setTimeout(()=>{if(delArmado===i){delArmado=null;render()}},3000);return}borrados.push(gastos[i].id);localStorage.setItem('borrados',JSON.stringify(borrados));apply(gastos[i],1);cartera.actualizado=Date.now();gastos.splice(i,1);delArmado=null;save()}
function edit(i){let g=gastos[i],n=prompt('Nuevo monto',g.monto);if(n==null)return;apply(g,1);g.monto=Number(n);g.desc=prompt('Nueva descripción',g.desc)||g.desc;g.actualizado=Date.now();apply(g,-1);cartera.actualizado=Date.now();save()}
function backup(){let b=new Blob([JSON.stringify({gastos,cartera},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='respaldo-gastos.json';a.click()}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(d.gastos)gastos=d.gastos;if(d.cartera)cartera=d.cartera;save();alert('Restaurado')}catch(err){alert('Archivo no válido')}};r.readAsText(f)}
render();setSync(!pendiente);sincronizar();
</script></body></html>
